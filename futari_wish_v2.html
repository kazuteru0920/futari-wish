<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff7f5"><title>ふたりのWish v2.0</title>
<style>*{box-sizing:border-box}body{margin:0;background:#fff7f5;color:#302b30;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif}main{max-width:650px;margin:auto;padding:18px 16px 100px}.logo{font-size:24px;font-weight:800;color:#b34e70}.sub,.muted{font-size:13px;color:#8b7d83}.sub{font-size:12px}.card{background:white;border:1px solid #f0dfe3;border-radius:18px;padding:17px;margin:12px 0;box-shadow:0 2px 8px #bd829017}.row,.flex{display:flex;gap:10px;align-items:center;justify-content:space-between}.flex input{flex:1;min-width:0}button,input,textarea,select{font:inherit}button{border:0;border-radius:12px;padding:12px 14px;background:#b95276;color:white;font-weight:700;cursor:pointer}button.secondary{background:#f8e9ed;color:#994260}button.ghost{background:transparent;color:#994260;padding:8px}button:disabled{opacity:.5}input,textarea,select{width:100%;padding:12px;border:1px solid #e7d6dc;border-radius:12px;background:white;color:#302b30}textarea{min-height:90px}h2{font-size:20px}h3{font-size:16px}.pill{display:inline-block;background:#fbe9ef;color:#9c4b68;border-radius:30px;padding:5px 10px;font-size:12px}.item{cursor:pointer}.item h3{margin:0 0 6px}.stats{display:flex;justify-content:space-around;text-align:center}.stats strong{font-size:26px;display:block}.chat{min-height:170px;max-height:430px;overflow:auto;display:flex;flex-direction:column;gap:10px}.bubble{max-width:90%;padding:12px;border-radius:14px;background:#f6eef0;align-self:flex-start;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.mine{align-self:flex-end;background:#f9dce6}.bubble small{display:block;color:#886d77;margin-bottom:4px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fffdfd;border-top:1px solid #f0dfe3;padding:10px 12px max(10px,env(safe-area-inset-bottom));display:flex;justify-content:center;gap:6px}.bottom button{background:transparent;color:#9c4b68;font-size:12px;padding:9px}.notice{background:#fff1d6;border-radius:12px;padding:12px;font-size:12px;color:#725520;margin:12px 0}label{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}.error{color:#a82039;white-space:pre-wrap}.ok{color:#28754c}.hidden{display:none}code{overflow-wrap:anywhere}header{display:flex;justify-content:space-between;align-items:center}button:focus-visible,input:focus-visible{outline:2px solid #9c4b68}</style></head>
<body><main><header><div><div class="logo">♡ ふたりのWish</div><div class="sub">ふたりの「いつか」を「実現」に。</div></div><span class="pill">v2.0 テスト</span></header><div class="notice">共有版のテストです。実際のAI接続はまだありません。旧版のメモは「バックアップ」してから移行してね。</div><div id="app"></div><p id="feedback" role="status"></p></main><nav id="nav" class="bottom hidden"><button onclick="home()">⌂ ホーム</button><button onclick="home(true)">＋ 追加</button><button onclick="showImport()">⇧ 引き継ぎ</button><button onclick="logout()">ログアウト</button></nav><input id="importfile" type="file" accept="application/json,.json" style="display:none" onchange="importBackup(event)">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let sb=null,user=null,couple=null,items=[],page='home',current=null,room='shared',messages=[],role='papa';
function feedback(msg,bad=false){$('#feedback').textContent=msg;$('#feedback').className=bad?'error':'ok'}
function fail(e){feedback(e?.message||String(e),true)}
function init(){const url=localStorage.getItem('wish_sb_url'),key=localStorage.getItem('wish_sb_key');if(url&&key&&window.supabase){try{sb=window.supabase.createClient(url,key);sb.auth.onAuthStateChange(()=>setTimeout(refreshSession,0));refreshSession();return}catch(e){fail(e)}}renderSetup()}
function renderSetup(){$('#nav').classList.add('hidden');$('#app').innerHTML=`<section class="card"><h2>初回の接続設定</h2><p class="muted">SupabaseのProject URLとPublishable keyを入力。Secret keyやデータベースのパスワードは入力しないでね。</p><label>Project URL</label><input id="url" placeholder="https://xxxxx.supabase.co" value="${esc(localStorage.getItem('wish_sb_url')||'')}"><label>Publishable key</label><input id="key" placeholder="sb_publishable_..." value="${esc(localStorage.getItem('wish_sb_key')||'')}"><p><button onclick="saveSetup()">接続する</button></p></section>`}
function saveSetup(){const url=$('#url').value.trim(),key=$('#key').value.trim();if(!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/.test(url)||!key.startsWith('sb_publishable_')&&!key.startsWith('eyJ'))return feedback('URLまたは公開用キーの形式を確認してね。',true);localStorage.setItem('wish_sb_url',url.replace(/\/$/,''));localStorage.setItem('wish_sb_key',key);location.reload()}
async function refreshSession(){if(!sb)return;const {data,error}=await sb.auth.getUser();if(error&&error.name!=='AuthSessionMissingError')fail(error);user=data?.user||null;if(!user){couple=null;renderAuth();return}await loadCouple()}
function renderAuth(){$('#nav').classList.add('hidden');$('#app').innerHTML=`<section class="card"><h2>ログイン・新規登録</h2><label>メールアドレス</label><input id="email" type="email" autocomplete="email"><label>パスワード（6文字以上）</label><input id="password" type="password" autocomplete="current-password"><div class="flex" style="margin-top:14px"><button onclick="auth('signInWithPassword')">ログイン</button><button class="secondary" onclick="auth('signUp')">新規登録</button></div><p class="muted">新規登録後は認証メールのリンクを開いてからログインしてね。</p></section>`}
async function auth(method){feedback('');const email=$('#email').value.trim(),password=$('#password').value;if(!email||password.length<6)return feedback('メールと6文字以上のパスワードを入力してね。',true);const {data,error}=await sb.auth[method]({email,password, ...(method==='signUp'?{options:{emailRedirectTo:location.origin+location.pathname}}:{})});if(error)return fail(error);feedback(method==='signUp'?'確認メールをチェックしてね。':'ログイン中…');if(method==='signInWithPassword'&&data.user)await refreshSession()}
async function loadCouple(){const {data,error}=await sb.from('couple_members').select('couple_id').eq('user_id',user.id).maybeSingle();if(error)return fail(error);couple=data?.couple_id||null;if(!couple){renderJoin();return}const {data:c}=await sb.from('couples').select('created_by').eq('id',couple).single();role=c?.created_by===user.id?'papa':'mama';await loadWishes()}
function renderJoin(){$('#nav').classList.add('hidden');$('#app').innerHTML=`<section class="card"><h2>夫婦のグループを設定</h2><p class="muted">最初にパパがグループを作成。ママは招待コードで参加するよ。</p><button onclick="createCouple()">新しい夫婦グループを作る</button><hr><label>招待コード（ママ側）</label><input id="invite" placeholder="招待コードを貼り付け"><p><button class="secondary" onclick="joinCouple()">招待コードで参加</button></p></section>`}
async function createCouple(){const {error}=await sb.rpc('create_couple');if(error)return fail(error);await loadCouple()}
async function joinCouple(){const token=$('#invite').value.trim();if(!/^[a-f0-9-]{36}$/i.test(token))return feedback('招待コードを確認してね。',true);const {error}=await sb.rpc('join_couple',{invite_token:token});if(error)return fail(error);await loadCouple()}
async function invite(){const {data,error}=await sb.rpc('create_couple_invite');if(error)return fail(error);$('#inviteOutput').textContent=data;feedback('24時間有効な招待コードを発行したよ。ママに個別に送ってね。')}
async function loadWishes(){const {data,error}=await sb.from('wishes').select('id,title,status,budget,wish_when,detail,created_at').eq('couple_id',couple).order('created_at',{ascending:false});if(error)return fail(error);items=data||[];home()}
function home(focus=false){page='home';$('#nav').classList.remove('hidden');$('#app').innerHTML=`<section class="card"><div class="muted">ふたりのやりたいこと</div><div class="stats">${['アイデア','計画中','実現！'].map(s=>`<div><strong>${items.filter(x=>x.status===s).length}</strong><span class="muted">${s}</span></div>`).join('')}</div></section><section class="card"><h3>夫婦の招待</h3><p class="muted">${role==='papa'?'ママに渡す招待コードを発行できるよ。':'ママとして参加中です。'}</p>${role==='papa'?'<button class="secondary" onclick="invite()">招待コードを発行</button><p><code id="inviteOutput"></code></p>':''}</section><h2>新しいやりたいこと</h2><div class="flex"><input id="newtitle" placeholder="例：温泉旅行に行きたい"><button onclick="addWish()">追加</button></div><h2>やりたいことリスト</h2>${items.length?items.map(x=>`<article class="card item" data-id="${x.id}"><h3>${esc(x.title)}</h3><span class="muted">${esc(x.status)}</span></article>`).join(''):'<p class="muted">まだメモがないよ。</p>'}`;document.querySelectorAll('.item').forEach(el=>el.onclick=()=>openWish(el.dataset.id));if(focus)$('#newtitle').focus()}
async function addWish(){const title=$('#newtitle').value.trim();if(!title)return;const {error}=await sb.from('wishes').insert({couple_id:couple,created_by:user.id,title});if(error)return fail(error);await loadWishes()}
function openWish(id){current=items.find(x=>x.id===id);page='detail';renderDetail()}
function renderDetail(){const x=current;$('#app').innerHTML=`<button class="ghost" onclick="home()">‹ 一覧に戻る</button><h2>${esc(x.title)}</h2><section class="card"><h3>詳細メモ</h3><label>進捗</label><select id="status">${['アイデア','計画中','実現！'].map(s=>`<option ${s===x.status?'selected':''}>${s}</option>`).join('')}</select><label>予算</label><input id="budget" value="${esc(x.budget)}"><label>時期</label><input id="when" value="${esc(x.wish_when)}"><label>詳細</label><textarea id="detail">${esc(x.detail)}</textarea><p><button onclick="saveWish()">メモを保存</button></p></section><h3>相談履歴</h3><p class="muted">本人の個別相談と夫婦共有の相談を保存できるよ。AIの自動返信は次のバージョンで追加するね。</p><div class="card item" onclick="openChat('${role}')">👤 自分の個別相談 ›</div><div class="card item" onclick="openChat('shared')">👥 ふたりの共有相談 ›</div>`}
async function saveWish(){const patch={status:$('#status').value,budget:$('#budget').value.trim(),wish_when:$('#when').value.trim(),detail:$('#detail').value.trim()};const {error}=await sb.from('wishes').update(patch).eq('id',current.id);if(error)return fail(error);Object.assign(current,patch);feedback('保存できたよ。');renderDetail()}
async function openChat(r){room=r;const {data,error}=await sb.from('wish_messages').select('id,author_id,body,created_at').eq('wish_id',current.id).eq('room',room).order('created_at');if(error)return fail(error);messages=data||[];renderChat()}
function renderChat(){$('#app').innerHTML=`<button class="ghost" onclick="renderDetail()">‹ メモに戻る</button><h3>${esc(current.title)}</h3><p class="pill">${room==='shared'?'ふたりの共有相談':'自分の個別相談'}</p><section class="card chat">${messages.length?messages.map(m=>`<div class="bubble ${m.author_id===user.id?'mine':''}"><small>${m.author_id===user.id?'自分':'パートナー'}</small>${esc(m.body)}</div>`).join(''):'<p class="muted">まだ相談履歴はないよ。</p>'}</section><div class="flex"><input id="msg" placeholder="メッセージを入力"><button onclick="sendMessage()">送信</button></div><p class="muted">※ 現在は夫婦のメッセージ保存のみ。AIは未接続です。</p>`}
async function sendMessage(){const body=$('#msg').value.trim();if(!body)return;const {error}=await sb.from('wish_messages').insert({wish_id:current.id,room,author_id:user.id,body});if(error)return fail(error);await openChat(room)}
function showImport(){$('#app').innerHTML=`<button class="ghost" onclick="home()">‹ 戻る</button><section class="card"><h2>旧版メモの引き継ぎ</h2><p>旧版v1.1の「⇩ バックアップ」で保存したJSONファイルを使うよ。</p><p class="muted">現在の共有メモは消さずに、新しいメモとして追加するよ。重複して取り込まないよう、1回だけ実行してね。チャットは旧版のデモAI応答も含めて移行するため、個別相談の履歴を移す場合は共有範囲を確認してね。</p><button onclick="$('#importfile').click()">バックアップJSONを選ぶ</button></section>`}
async function importBackup(e){const file=e.target.files?.[0];if(!file)return;try{const old=JSON.parse(await file.text());if(!Array.isArray(old)||!old.every(x=>x&&typeof x.title==='string'))throw Error('バックアップの形式が違うよ');if(!confirm(`${old.length}件のメモを追加するよ。続ける？`))return;for(const x of old){const {data:w,error}=await sb.from('wishes').insert({couple_id:couple,created_by:user.id,title:x.title,detail:x.detail||'',budget:x.budget||'',wish_when:x.when||'',status:['アイデア','計画中','実現！'].includes(x.status)?x.status:'アイデア'}).select('id').single();if(error)throw error;for(const r of ['papa','mama','shared']){if(r!=='shared'&&r!==role)continue;for(const m of (x.chats?.[r]||[])){if(!m.text)continue;const {error:me}=await sb.from('wish_messages').insert({wish_id:w.id,room:r,author_id:user.id,body:`${m.who||'旧版'}: ${m.text}`.slice(0,10000)});if(me)throw me}}}feedback('引き継ぎが完了したよ！');await loadWishes()}catch(err){fail(err);feedback('一部のみ取り込まれた可能性があります。重複を防ぐため再実行前に確認してね。 '+err.message,true)}finally{e.target.value=''}}
async function logout(){await sb.auth.signOut();user=null;couple=null;renderAuth()}
init();
</script></body></html>
