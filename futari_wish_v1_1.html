<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff7f5"><title>ふたりのWish v1.1</title><style>*{box-sizing:border-box}body{margin:0;background:#fff7f5;color:#302b30;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif}main{max-width:650px;margin:auto;padding:20px 16px 90px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.logo{font-size:24px;font-weight:800;color:#b34e70}.sub{font-size:12px;color:#8b7d83}.card{background:white;border:1px solid #f0dfe3;border-radius:18px;padding:17px;margin:12px 0;box-shadow:0 2px 8px #bd829017}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.muted{color:#8d8086;font-size:13px}button,input,textarea,select{font:inherit}button{border:0;border-radius:12px;padding:12px 16px;background:#b95276;color:white;font-weight:700;cursor:pointer}button.secondary{background:#f8e9ed;color:#994260}button.ghost{background:transparent;color:#994260;padding:8px}button:disabled{opacity:.5}input,textarea,select{width:100%;padding:12px;border:1px solid #e7d6dc;border-radius:12px;background:white;color:#302b30}textarea{min-height:80px;resize:vertical}h2{font-size:20px;margin:12px 0}h3{font-size:16px;margin:10px 0}.pill{display:inline-block;background:#fbe9ef;color:#9c4b68;border-radius:30px;padding:5px 10px;font-size:12px}.item{cursor:pointer}.item h3{margin:0 0 6px}.stats{display:flex;justify-content:space-around;text-align:center}.stats strong{font-size:26px;display:block}.chat{min-height:190px;max-height:420px;overflow:auto;display:flex;flex-direction:column;gap:10px}.bubble{max-width:90%;padding:12px;border-radius:14px;background:#f6eef0;align-self:flex-start;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.mine{align-self:flex-end;background:#f9dce6}.bubble small{display:block;color:#886d77;margin-bottom:4px}.tabs{display:flex;gap:6px}.tabs button{flex:1;font-size:12px;padding:10px 4px}.tabs button.off{background:#f8e9ed;color:#994260}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fffdfd;border-top:1px solid #f0dfe3;padding:10px 20px max(10px,env(safe-area-inset-bottom));display:flex;justify-content:center;gap:30px}.bottom button{background:transparent;color:#9c4b68}.hidden{display:none}.notice{background:#fff1d6;border-radius:12px;padding:12px;font-size:12px;color:#725520;margin:12px 0}label{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}.flex{display:flex;gap:8px}.flex input{flex:1;min-width:0}.flex button{white-space:nowrap}.spacer{height:8px}</style></head><body><main><header><div><div class="logo">♡ ふたりのWish</div><div class="sub">ふたりの「いつか」を「実現」に。</div></div><span class="pill">試作版 1.0</span></header><div class="notice">この版は端末内保存のデモです。夫婦間の同期・本人認証・本物のAI応答はまだありません。個別相談の秘密を守る認証も未実装です。</div><div id="app"></div></main><nav class="bottom"><button onclick="goHome()">⌂ ホーム</button><button onclick="goHome();setTimeout(()=>document.getElementById('newtitle')?.focus(),20)">＋ 追加</button><button onclick="exportData()">⇩ バックアップ</button><button onclick="document.getElementById('importfile').click()">⇧ 復元</button><input id="importfile" type="file" accept="application/json,.json" style="display:none" onchange="importData(event)"></nav><script>
const key='futari-wish-v1';let items;try{items=JSON.parse(localStorage.getItem(key))||[]}catch{items=[]}let page='home',id=null,room='shared',speaker='パパ',proposal=null;const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function persist(){localStorage.setItem(key,JSON.stringify(items))}function active(){return items.find(x=>x.id===id)}function goHome(){page='home';render()}function openItem(n){id=n;page='detail';render()}function add(){let v=$('#newtitle').value.trim();if(!v)return;items.unshift({id:Date.now(),title:v,status:'アイデア',budget:'',when:'',detail:'',chats:{papa:[],mama:[],shared:[]}});persist();$('#newtitle').value='';render()}function saveDetails(){let x=active();x.budget=$('#budget').value.trim();x.when=$('#when').value.trim();x.detail=$('#detail').value.trim();x.status=$('#status').value;persist();render()}function openChat(r){room=r;proposal=null;page='chat';render()}function send(){let t=$('#msg').value.trim();if(!t)return;let x=active(),who=room==='shared'?speaker:(room==='papa'?'パパ':'ママ');x.chats[room].push({who,text:t});let bm=t.match(/(?:予算|費用)[はを：:\s]*([0-9０-９,，]+(?:万円|万|円))/),wm=t.match(/(?:来年|今年)?\d{1,2}月(?:ごろ|頃)?/);let response=bm||wm?'相談内容からメモの更新候補を見つけたよ。内容を確認して保存してね。':'いいね！いつ頃やりたいか、予算はどのくらいか考えてみよう。';x.chats[room].push({who:'AI（デモ）',text:response});proposal=(bm||wm)?{budget:bm?bm[1]:x.budget,when:wm?wm[0]:x.when}:null;persist();render()}function accept(){Object.assign(active(),proposal);proposal=null;persist();render()}function exportData(){let blob=new Blob([JSON.stringify(items,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='futari-wish-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function importData(e){let f=e.target.files?.[0];if(!f)return;try{let parsed=JSON.parse(await f.text());if(!Array.isArray(parsed)||!parsed.every(x=>x&&typeof x.title==='string'&&x.chats&&typeof x.chats==='object'))throw Error('形式が違います');if(!confirm('現在のメモをバックアップの内容で置き換えますか？'))return;items=parsed;persist();goHome();alert('復元しました。');}catch(err){alert('復元できませんでした：'+err.message)}finally{e.target.value=''}}function storageStatus(){try{let k='futari-wish-test';localStorage.setItem(k,'ok');let ok=localStorage.getItem(k)==='ok';localStorage.removeItem(k);return ok?'このブラウザでは保存機能が使えます。ただし、ファイルから直接開く場合は再起動後の保持が保証されません。':'保存機能を利用できません。'}catch{return 'この開き方では保存機能が利用できません。Webサイトとして公開する必要があります。'}}function render(){let a=$('#app');if(page==='home'){a.innerHTML=`<section class="card"><div class="muted">ふたりのやりたいこと</div><div class="stats">${['アイデア','計画中','実現！'].map(s=>`<div><strong>${items.filter(x=>x.status===s).length}</strong><span class="muted">${s}</span></div>`).join('')}</div></section><section class="card"><strong>💾 保存について</strong><p class="muted">${storageStatus()}</p><p class="muted">大切なメモは画面下の「⇩ バックアップ」で保存してね。復元もできます。</p></section><h2>新しいやりたいこと</h2><div class="flex"><input id="newtitle" placeholder="例：家族で温泉旅行に行きたい"><button onclick="add()">追加</button></div><h2>やりたいことリスト</h2>${items.length?items.map(x=>`<article class="card item" onclick="openItem(${x.id})"><div class="row"><div><h3>${esc(x.title)}</h3><span class="muted">${esc(x.status)}</span></div><span>›</span></div></article>`).join(''):'<p class="muted">まだメモがありません。最初のやりたいことを登録してね。</p>'}`;$('#newtitle').addEventListener('keydown',e=>{if(e.key==='Enter')add()})}else if(page==='detail'){let x=active();a.innerHTML=`<button class="ghost" onclick="goHome()">‹ 一覧に戻る</button><h2>${esc(x.title)}</h2><section class="card"><h3>詳細メモ</h3><label>進捗</label><select id="status">${['アイデア','計画中','実現！'].map(s=>`<option ${s===x.status?'selected':''}>${s}</option>`).join('')}</select><label>予算</label><input id="budget" value="${esc(x.budget)}" placeholder="例：3万円"><label>時期</label><input id="when" value="${esc(x.when)}" placeholder="例：来年5月"><label>詳細</label><textarea id="detail" placeholder="自由にメモ">${esc(x.detail)}</textarea><div class="spacer"></div><button onclick="saveDetails()">メモを保存</button></section><h3>AIと相談する</h3><div class="card item" onclick="openChat('papa')">👤 パパ＋AI <span class="muted">（個別）</span> ›</div><div class="card item" onclick="openChat('mama')">👤 ママ＋AI <span class="muted">（個別）</span> ›</div><div class="card item" onclick="openChat('shared')">👥 ふたり＋AI <span class="muted">（共有）</span> ›</div>`}else{let x=active(),name={papa:'パパ＋AI',mama:'ママ＋AI',shared:'ふたり＋AI'}[room];a.innerHTML=`<button class="ghost" onclick="page='detail';render()">‹ メモに戻る</button><h3>${esc(x.title)}</h3><div class="tabs">${[['papa','パパ＋AI'],['mama','ママ＋AI'],['shared','ふたり＋AI']].map(([r,n])=>`<button class="${r===room?'':'off'}" onclick="openChat('${r}')">${n}</button>`).join('')}</div><p class="muted">${name} · ${room==='shared'?'共有相談':'個別相談'}</p>${room==='shared'?`<div class="row"><span class="muted">発言者を選択</span><select style="width:130px" id="speaker" onchange="speaker=this.value"><option ${speaker==='パパ'?'selected':''}>パパ</option><option ${speaker==='ママ'?'selected':''}>ママ</option></select></div>`:''}<section class="card chat">${x.chats[room].length?x.chats[room].map(m=>`<div class="bubble ${m.who==='AI（デモ）'?'':'mine'}"><small>${esc(m.who)}</small>${esc(m.text)}</div>`).join(''):'<p class="muted">AIに相談してみよう！</p>'}</section>${proposal?`<section class="card"><h3>✨ AIからのメモ更新提案</h3><p>予算：${esc(proposal.budget||'未定')}</p><p>時期：${esc(proposal.when||'未定')}</p><div class="flex"><button class="secondary" onclick="proposal=null;render()">却下</button><button onclick="accept()">確認して保存</button></div></section>`:''}<div class="flex"><input id="msg" placeholder="相談内容を入力"><button onclick="send()">送信</button></div><p class="muted">※ AIの返答はルールに基づくデモです。</p>`;$('#msg').addEventListener('keydown',e=>{if(e.key==='Enter')send()})}}render();</script></body></html>
